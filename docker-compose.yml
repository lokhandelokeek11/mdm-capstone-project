version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cji-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cji_user
      POSTGRES_PASSWORD: cji_password
      POSTGRES_DB: customer_journey_intelligence
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
